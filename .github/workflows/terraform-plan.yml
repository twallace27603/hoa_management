name: Terraform Plan

# Comments a plan on PRs that touch infra/. Requires one-time setup:
# - An Azure AD app registration with federated credentials for OIDC
#   (no client secret stored in GitHub) - see README.md "Infra setup".
# - Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   TFSTATE_RESOURCE_GROUP, TFSTATE_STORAGE_ACCOUNT (from infra/bootstrap
#   outputs), and the app-specific tfvars secrets listed in
#   infra/envs/dev/terraform.tfvars.example.
on:
  pull_request:
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var="postgres_administrator_password=${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            -var="entra_tenant_id=${{ secrets.ENTRA_TENANT_ID }}" \
            -var="entra_client_id=${{ secrets.ENTRA_CLIENT_ID }}" \
            -var="entra_jwks_uri=${{ secrets.ENTRA_JWKS_URI }}" \
            -var="entra_issuer=${{ secrets.ENTRA_ISSUER }}" \
            -var="cors_origin=${{ secrets.FRONTEND_ORIGIN }}"
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan (infra/envs/dev)
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
